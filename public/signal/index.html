<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0A0A08" />
  <title>Signal Generator | Snapshot Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js" defer></script>
  <style>
    :root {
      --bg-primary: #0A0A08;
      --bg-surface: #111110;
      --bg-elevated: #1A1A17;
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: #6B5A2E;
      --cream: #F5F0E8;
      --cream-dim: #A89F8C;
      --red-signal: #C84B3C;
      --green-signal: #4B8C6E;
      --border: rgba(201,168,76,0.15);
      --signal: #C9A84C;
      --signal-rgb: 201, 168, 76;
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; background: var(--bg-primary); }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% 4%, rgba(201, 168, 76, 0.12), transparent 28rem),
        radial-gradient(circle at 85% 12%, rgba(200, 75, 60, 0.08), transparent 24rem),
        linear-gradient(180deg, #0A0A08 0%, #0D0D0B 100%);
      color: var(--cream);
      font-family: "DM Sans", system-ui, sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.85), transparent 70%);
    }

    button, input, select { font: inherit; }

    button { cursor: pointer; }

    .app {
      width: min(1120px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 22px;
    }

    .view {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 260ms ease, transform 260ms ease;
    }

    .view.is-hiding {
      opacity: 0;
      transform: translateY(8px);
    }

    .screen-hidden { display: none !important; }

    .operator-shell {
      display: grid;
      min-height: calc(100vh - 44px);
      align-items: center;
      padding: 28px 0;
    }

    .operator-panel {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(24px, 5vw, 54px);
      border: 1px solid var(--border);
      background:
        radial-gradient(circle at 82% 0%, rgba(201, 168, 76, 0.12), transparent 18rem),
        linear-gradient(145deg, rgba(26,26,23,0.88), rgba(17,17,16,0.94));
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.42);
    }

    .brand-label,
    .micro-label,
    .form-label,
    .pill,
    .footer-signal,
    .day-label {
      color: var(--gold);
      font-family: "Space Mono", monospace;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .operator-title {
      max-width: 660px;
      margin: 18px 0 38px;
      color: var(--cream);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 0.88;
    }

    .operator-subtitle {
      max-width: 560px;
      margin: -20px 0 40px;
      color: var(--cream-dim);
      font-size: 1rem;
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      gap: 30px;
    }

    .field-grid {
      display: grid;
      gap: 24px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-bottom: 1px solid rgba(201,168,76,0.34);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--cream);
      font-size: 1.06rem;
      font-weight: 600;
      transition: border-color 180ms ease, color 180ms ease;
    }

    .field input:focus,
    .field select:focus {
      border-bottom-color: var(--gold-light);
    }

    .field input::placeholder { color: rgba(168,159,140,0.62); }

    .field select option { background: var(--bg-elevated); color: var(--cream); }

    .toggle-grid {
      display: grid;
      gap: 12px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid rgba(201,168,76,0.14);
      color: var(--cream);
      font-weight: 700;
    }

    .toggle-row span { color: var(--cream-dim); font-size: 0.9rem; font-weight: 500; }

    .switch {
      position: relative;
      flex: 0 0 auto;
      width: 54px;
      height: 28px;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .slider {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(201,168,76,0.28);
      border-radius: 999px;
      background: #090907;
      transition: border-color 180ms ease, background 180ms ease;
    }

    .slider::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 5px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--cream-dim);
      transition: transform 180ms ease, background 180ms ease;
    }

    .switch input:checked + .slider {
      border-color: rgba(232,201,122,0.7);
      background: rgba(201,168,76,0.18);
    }

    .switch input:checked + .slider::after {
      transform: translateX(24px);
      background: var(--gold-light);
    }

    .primary-btn,
    .secondary-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 18px;
      border: 1px solid rgba(201,168,76,0.42);
      background: linear-gradient(135deg, var(--gold-light), var(--gold));
      color: #111110;
      font-weight: 900;
      letter-spacing: 0.01em;
      text-decoration: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .secondary-btn {
      background: rgba(245,240,232,0.04);
      color: var(--cream);
    }

    .primary-btn:hover,
    .secondary-btn:hover { transform: translateY(-1px); border-color: var(--gold-light); }

    .form-actions {
      display: flex;
      justify-content: flex-start;
      padding-top: 4px;
    }

    .report-wrap {
      display: grid;
      gap: 18px;
      justify-items: center;
      padding: 10px 0 36px;
    }

    .report-card {
      position: relative;
      isolation: isolate;
      width: min(100%, 760px);
      min-height: min(1180px, calc(100vh - 44px));
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.2);
      background:
        radial-gradient(circle at 72% 18%, rgba(var(--signal-rgb), 0.28), transparent 23rem),
        linear-gradient(180deg, #111110 0%, #0A0A08 55%, #111110 100%);
      box-shadow: 0 34px 110px rgba(0,0,0,0.55);
    }

    .report-card::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      background-image:
        radial-gradient(circle at 1px 1px, rgba(245,240,232,0.32) 1px, transparent 0);
      background-size: 18px 18px;
      mix-blend-mode: screen;
    }

    .header-band {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: clamp(16px, 4vw, 26px);
      border-bottom: 1px solid rgba(201,168,76,0.22);
    }

    .header-band .date {
      justify-self: end;
      color: var(--cream-dim);
      font-family: "Space Mono", monospace;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .pill {
      justify-self: center;
      max-width: 100%;
      padding: 8px 12px;
      border: 1px solid rgba(201,168,76,0.2);
      background: rgba(201,168,76,0.08);
      color: var(--gold-light);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hero-block {
      padding: clamp(30px, 7vw, 64px) clamp(22px, 5vw, 52px) clamp(24px, 5vw, 46px);
      transform-origin: center top;
      animation: heroIn 520ms ease both;
    }

    .business-name {
      margin: 0 0 12px;
      color: rgba(245,240,232,0.72);
      font-size: clamp(0.95rem, 2vw, 1.08rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .archetype-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 18px;
    }

    .archetype-title {
      margin: 0;
      color: #F5F0E8;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4.4rem, 16vw, 8.8rem);
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 0.82;
      opacity: 1;
      mix-blend-mode: normal;
      filter: none;
      background: none;
      -webkit-text-fill-color: #F5F0E8;
      text-shadow: 0 0 28px rgba(245, 240, 232, 0.16), 0 2px 0 rgba(0,0,0,0.4);
    }

    .archetype-badge {
      width: min-content;
      min-width: 106px;
      padding: 12px 10px;
      border: 1px solid rgba(201,168,76,0.24);
      color: var(--gold-light);
      font-family: "Space Mono", monospace;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      text-transform: uppercase;
    }

    .one-liner {
      max-width: 570px;
      margin: 20px 0 0;
      color: rgba(245,240,232,0.9);
      font-size: clamp(1.1rem, 3vw, 1.45rem);
      font-weight: 700;
      line-height: 1.28;
    }

    .parallel {
      max-width: 620px;
      margin: 12px 0 0;
      color: rgba(168,159,140,0.9);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .score-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      border-top: 1px solid rgba(201,168,76,0.16);
      border-bottom: 1px solid rgba(201,168,76,0.16);
      background: rgba(201,168,76,0.12);
    }

    .score-module {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 58px;
      align-items: center;
      gap: 12px;
      min-width: 0;
      padding: clamp(16px, 3vw, 24px);
      background: rgba(10,10,8,0.76);
    }

    .score-label {
      margin: 0 0 7px;
      color: var(--cream-dim);
      font-size: 0.67rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .score-value {
      margin: 0;
      color: var(--score-color, var(--gold));
      font-family: "Space Mono", monospace;
      font-size: clamp(2rem, 7vw, 3.4rem);
      font-weight: 700;
      line-height: 0.9;
    }

    .score-ring {
      width: 58px;
      height: 58px;
      transform: rotate(-90deg);
    }

    .score-ring .track { stroke: rgba(245,240,232,0.12); }
    .score-ring .progress {
      stroke: var(--score-color, var(--gold));
      stroke-dasharray: 132;
      stroke-dashoffset: 132;
      transition: stroke-dashoffset 900ms cubic-bezier(.2,.8,.2,1) 180ms;
    }

    .report-card.is-ready .score-ring .progress { stroke-dashoffset: var(--dash); }

    .diagnosis-block {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.12);
      border-bottom: 1px solid rgba(201,168,76,0.16);
    }

    .diagnosis-panel {
      padding: clamp(22px, 4vw, 36px);
      background: rgba(17,17,16,0.88);
    }

    .section-title {
      margin: 0 0 18px;
      color: var(--gold-light);
      font-family: "Space Mono", monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .signal-list {
      display: grid;
      gap: 14px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .signal-list li {
      position: relative;
      padding-left: 18px;
      color: var(--cream);
      font-size: 0.98rem;
      font-weight: 650;
      line-height: 1.5;
    }

    .signal-list li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.63em;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green-signal);
      box-shadow: 0 0 16px var(--green-signal);
    }

    .leak-list li::before { background: var(--red-signal); box-shadow: 0 0 16px var(--red-signal); }

    .readiness {
      padding: clamp(24px, 5vw, 42px) clamp(22px, 5vw, 52px);
      border-bottom: 1px solid rgba(201,168,76,0.16);
    }

    .meter-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 12px;
    }

    .meter-sub {
      margin: 5px 0 0;
      color: var(--cream-dim);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .meter-percent {
      color: var(--gold-light);
      font-family: "Space Mono", monospace;
      font-size: clamp(1.8rem, 7vw, 3rem);
      font-weight: 700;
      line-height: 1;
    }

    .meter-track {
      height: 12px;
      overflow: hidden;
      background: rgba(245,240,232,0.1);
    }

    .meter-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-light));
      box-shadow: 0 0 26px rgba(232,201,122,0.28);
      transition: width 900ms cubic-bezier(.2,.8,.2,1) 260ms;
    }

    .report-card.is-ready .meter-fill { width: var(--meter); }

    .meter-sentence {
      margin: 14px 0 0;
      color: var(--cream);
      font-size: 0.98rem;
      font-weight: 650;
      line-height: 1.5;
    }

    .plan {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.12);
      border-bottom: 1px solid rgba(201,168,76,0.16);
    }

    .plan-card {
      padding: clamp(18px, 3vw, 28px);
      background: rgba(17,17,16,0.86);
    }

    .plan-card h3 {
      margin: 12px 0 7px;
      color: var(--cream);
      font-size: clamp(1.02rem, 2vw, 1.22rem);
      line-height: 1.18;
    }

    .plan-card p {
      margin: 0;
      color: var(--cream-dim);
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .footer-band {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: clamp(18px, 4vw, 28px) clamp(22px, 5vw, 52px);
    }

    .footer-cta {
      color: var(--gold-light);
      font-size: 0.94rem;
      font-weight: 900;
      text-align: right;
    }

    .report-card.is-exporting {
      color: #F5F0E8;
      background:
        radial-gradient(circle at 72% 18%, rgba(var(--signal-rgb), 0.28), transparent 23rem),
        linear-gradient(180deg, #111110 0%, #0A0A08 55%, #111110 100%);
    }

    .report-card.is-exporting::before {
      opacity: 0.14;
      mix-blend-mode: normal;
    }

    .report-card.is-exporting .archetype-title {
      color: #F5F0E8;
      text-shadow: 0 0 28px rgba(245, 240, 232, 0.16), 0 2px 0 rgba(0,0,0,0.4);
    }

    .report-card.is-exporting .business-name,
    .report-card.is-exporting .one-liner,
    .report-card.is-exporting .signal-list li,
    .report-card.is-exporting .meter-sentence,
    .report-card.is-exporting .plan-card h3 {
      color: #F5F0E8;
    }

    .report-card.is-exporting .brand-label,
    .report-card.is-exporting .pill,
    .report-card.is-exporting .archetype-badge,
    .report-card.is-exporting .section-title,
    .report-card.is-exporting .meter-percent,
    .report-card.is-exporting .footer-signal,
    .report-card.is-exporting .footer-cta,
    .report-card.is-exporting .day-label {
      color: #C9A84C;
    }

    .report-card.is-exporting .header-band .date,
    .report-card.is-exporting .parallel,
    .report-card.is-exporting .score-label,
    .report-card.is-exporting .meter-sub,
    .report-card.is-exporting .plan-card p {
      color: #A89F8C;
    }

    .report-card.is-exporting .score-value {
      color: var(--score-color, #C9A84C);
    }

    .report-card.is-exporting .score-ring .progress {
      stroke-dashoffset: var(--dash);
    }

    .report-card.is-exporting .meter-fill {
      width: var(--meter);
    }

    .signal-export-stage {
      position: fixed;
      left: -10000px;
      top: 0;
      width: 760px;
      background: #0A0A08;
      pointer-events: none;
    }

    .signal-export-card,
    .signal-export-card * {
      box-sizing: border-box;
      mix-blend-mode: normal;
      filter: none;
      backdrop-filter: none;
      -webkit-background-clip: initial;
      background-clip: initial;
      mask-image: none;
      -webkit-mask-image: none;
    }

    .signal-export-card {
      width: 760px;
      min-height: 1180px;
      overflow: hidden;
      border: 1px solid rgba(201,168,76,0.28);
      background: #0A0A08;
      color: #F5F0E8;
      font-family: "DM Sans", system-ui, sans-serif;
    }

    .export-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      padding: 26px;
      border-bottom: 1px solid rgba(201,168,76,0.28);
      background: #111110;
    }

    .export-brand,
    .export-pill,
    .export-date,
    .export-label,
    .export-day {
      color: #C9A84C;
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .export-pill {
      max-width: 320px;
      padding: 8px 12px;
      border: 1px solid rgba(201,168,76,0.36);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .export-date { text-align: right; }

    .export-hero {
      padding: 54px 52px 42px;
      background: #0A0A08;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    .export-business {
      display: block;
      width: auto;
      max-width: none;
      max-height: none;
      margin: 0 0 16px;
      overflow: visible;
      color: #D9D1C4;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.08em;
      line-height: 1.35;
      text-transform: uppercase;
      white-space: normal;
      overflow-wrap: break-word;
      word-break: normal;
      text-overflow: clip;
    }

    .export-hero-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 118px;
      align-items: end;
      gap: 18px;
    }

    .export-title {
      margin: 0;
      color: #F5F0E8;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 104px;
      font-weight: 600;
      line-height: 0.84;
      letter-spacing: 0;
      opacity: 1;
      background: none;
      -webkit-text-fill-color: #F5F0E8;
      text-shadow: 0 0 28px rgba(245,240,232,0.16), 0 2px 0 rgba(0,0,0,0.4);
    }

    .export-badge {
      padding: 12px 10px;
      border: 1px solid rgba(201,168,76,0.42);
      color: #C9A84C;
      font-family: "Space Mono", monospace;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
      text-align: center;
      text-transform: uppercase;
    }

    .export-one-liner {
      max-width: 570px;
      margin: 22px 0 0;
      color: #F5F0E8;
      font-size: 23px;
      font-weight: 700;
      line-height: 1.25;
    }

    .export-parallel {
      max-width: 620px;
      margin: 13px 0 0;
      color: #A89F8C;
      font-size: 15px;
      line-height: 1.55;
    }

    .export-score-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.26);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    .export-score {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 64px;
      align-items: center;
      gap: 14px;
      padding: 24px;
      background: #111110;
    }

    .export-score-value {
      margin: 8px 0 0;
      color: #C9A84C;
      font-family: "Space Mono", monospace;
      font-size: 48px;
      font-weight: 700;
      line-height: 1;
    }

    .export-score-ring {
      width: 64px;
      height: 64px;
      overflow: visible;
    }

    .export-score-ring .export-ring-track {
      stroke: #2A2418;
    }

    .export-score-ring .export-ring-progress {
      stroke: #C9A84C;
    }

    .export-diagnosis,
    .export-plan {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1px;
      background: rgba(201,168,76,0.24);
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    .export-panel,
    .export-plan-card {
      padding: 30px;
      background: #111110;
    }

    .export-list {
      display: grid;
      gap: 13px;
      margin: 16px 0 0;
      padding: 0;
      list-style: none;
    }

    .export-list li {
      color: #F5F0E8;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.48;
    }

    .export-readiness {
      padding: 34px 52px;
      background: #0A0A08;
      border-bottom: 1px solid rgba(201,168,76,0.2);
    }

    .export-meter-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .export-meter-sub,
    .export-plan-card p {
      margin: 7px 0 0;
      color: #A89F8C;
      font-size: 14px;
      line-height: 1.48;
    }

    .export-meter-percent {
      color: #C9A84C;
      font-family: "Space Mono", monospace;
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
    }

    .export-meter-track {
      height: 12px;
      background: #242018;
    }

    .export-meter-fill {
      height: 100%;
      background: #C9A84C;
    }

    .export-meter-sentence {
      margin: 14px 0 0;
      color: #F5F0E8;
      font-size: 15px;
      font-weight: 650;
      line-height: 1.48;
    }

    .export-plan {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .export-plan-card h3 {
      margin: 12px 0 0;
      color: #F5F0E8;
      font-size: 18px;
      line-height: 1.16;
    }

    .export-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 26px 52px;
      background: #0A0A08;
    }

    .export-cta {
      color: #C9A84C;
      font-size: 15px;
      font-weight: 900;
      text-align: right;
    }

    .report-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      width: min(100%, 760px);
    }

    .toast {
      min-height: 20px;
      color: var(--gold-light);
      font-size: 0.88rem;
      font-weight: 800;
      text-align: center;
    }

    @keyframes heroIn {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (min-width: 720px) {
      .field-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .field-full { grid-column: 1 / -1; }
    }

    @media (max-width: 700px) {
      .app { padding: 12px; }
      .operator-shell { min-height: calc(100vh - 24px); }
      .operator-panel { padding: 24px 18px; }
      .operator-title { margin-bottom: 32px; }
      .header-band {
        grid-template-columns: 1fr;
        justify-items: start;
      }
      .header-band .date,
      .pill { justify-self: start; }
      .archetype-row { grid-template-columns: minmax(0, 1fr); }
      .archetype-badge { width: auto; min-width: 0; justify-self: start; }
      .score-row,
      .diagnosis-block,
      .plan { grid-template-columns: minmax(0, 1fr); }
      .score-module { grid-template-columns: minmax(0, 1fr) 64px; }
      .footer-band { align-items: flex-start; flex-direction: column; }
      .footer-cta { text-align: left; }
    }

    @media (max-width: 420px) {
      .archetype-title { font-size: 4rem; }
      .score-module { padding: 16px; }
      .report-actions { align-items: stretch; flex-direction: column; }
      .report-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="formView" class="view operator-shell" aria-label="Operator input form">
      <form id="signalForm" class="operator-panel">
        <div class="brand-label">Snapshot Studio</div>
        <h1 class="operator-title">AI Search Readiness Signal</h1>
        <p class="operator-subtitle">Generate a screenshot-worthy outreach card from public business signals. Built for links, images, and fast cold outreach.</p>

        <div class="form-grid">
          <div class="field-grid">
            <label class="field field-full">
              <span class="form-label">Business Name</span>
              <input id="businessName" name="businessName" autocomplete="organization" placeholder="Foothill Family Dental" required />
            </label>

            <label class="field">
              <span class="form-label">Category</span>
              <select id="category" name="category" required>
                <option value="Dental">Dental</option>
                <option value="Med Spa">Med Spa</option>
                <option value="Aesthetics">Aesthetics</option>
                <option value="Wellness">Wellness</option>
                <option value="Salon">Salon</option>
                <option value="Chiro">Chiro</option>
                <option value="Vision">Vision</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label class="field">
              <span class="form-label">City</span>
              <input id="city" name="city" autocomplete="address-level2" placeholder="Glendora" required />
            </label>

            <label class="field">
              <span class="form-label">Google Review Count</span>
              <input id="reviewCount" name="reviewCount" type="number" min="0" step="1" inputmode="numeric" placeholder="87" required />
            </label>

            <label class="field">
              <span class="form-label">Average Star Rating</span>
              <input id="starRating" name="starRating" type="number" min="1" max="5" step="0.1" inputmode="decimal" placeholder="4.6" required />
            </label>
          </div>

          <div class="toggle-grid" aria-label="Signal toggles">
            <label class="toggle-row">
              <span><strong>Website exists?</strong></span>
              <span class="switch"><input id="hasWebsite" name="hasWebsite" type="checkbox" checked /><i class="slider"></i></span>
            </label>
            <label class="toggle-row">
              <span><strong>Active on Instagram?</strong></span>
              <span class="switch"><input id="hasIg" name="hasIg" type="checkbox" /><i class="slider"></i></span>
            </label>
            <label class="toggle-row">
              <span><strong>Google Business Profile complete?</strong></span>
              <span class="switch"><input id="gbpComplete" name="gbpComplete" type="checkbox" checked /><i class="slider"></i></span>
            </label>
          </div>

          <div class="form-actions">
            <button class="primary-btn" type="submit">Generate Snapshot →</button>
          </div>
        </div>
      </form>
    </section>

    <section id="reportView" class="view report-wrap screen-hidden" aria-label="Generated report card">
      <article id="reportCard" class="report-card" aria-live="polite"></article>
      <div class="report-actions">
        <button id="downloadBtn" class="primary-btn" type="button">Download as Image</button>
        <button id="copyLinkBtn" class="secondary-btn" type="button">Copy Link</button>
        <button id="editBtn" class="secondary-btn" type="button">Edit inputs</button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script>
    const archetypes = {
      HIDDEN_GEM: {
        key: 'HIDDEN_GEM', number: '01', name: 'The Hidden Gem', oneLiner: 'Strong business. Under-seen online.', signalColor: '#C9A84C',
        parallel: 'The restaurant with no sign but a 2-hour wait.',
        threat: 'AI search may skip you if competitors explain their proof and services more clearly.'
      },
      AUTHORITY: {
        key: 'AUTHORITY', number: '02', name: 'The Local Authority', oneLiner: 'Dominant signal. Local searches end here.', signalColor: '#4B8C6E',
        parallel: 'The name everyone recommends before the question is finished.',
        threat: 'Authority has to be maintained as AI tools compress choices into fewer recommendations.'
      },
      GHOST_SIGNAL: {
        key: 'GHOST_SIGNAL', number: '03', name: 'The Ghost Signal', oneLiner: 'Visible in AI. Hard to trust on arrival.', signalColor: '#6B7FBF',
        parallel: 'A bright sign on a locked door.',
        threat: 'AI may surface you, but weak proof can lose the patient/client after the click.'
      },
      INVISIBLE: {
        key: 'INVISIBLE', number: '04', name: 'The Invisible', oneLiner: "No digital footprint. Patients can't find you.", signalColor: '#C84B3C',
        parallel: 'A great practice hidden behind a blank storefront.',
        threat: 'If AI tools cannot verify you, they are likely to recommend someone else.'
      },
      QUIET_GIANT: {
        key: 'QUIET_GIANT', number: '05', name: 'The Quiet Giant', oneLiner: 'Strong reputation. Missing social proof layer.', signalColor: '#8C6E4B',
        parallel: 'The trusted local name that never talks online.',
        threat: 'Reputation alone is not enough when patients compare proof before calling.'
      },
      BLIND_SPOT: {
        key: 'BLIND_SPOT', number: '06', name: 'The Blind Spot', oneLiner: 'Gaps in trust and visibility compound over time.', signalColor: '#8C4B6E',
        parallel: 'A leak behind the wall before the stain shows.',
        threat: 'AI search makes weak signals more expensive because fewer businesses get shown.'
      },
      RISING_SIGNAL: {
        key: 'RISING_SIGNAL', number: '07', name: 'The Rising Signal', oneLiner: 'Good bones. A few moves from top-3 placement.', signalColor: '#4B8C8C',
        parallel: 'The challenger brand starting to show up everywhere.',
        threat: 'Competitors who move faster on proof, FAQs, and local trust can outrank you before you notice.'
      },
      UNCHARTED: {
        key: 'UNCHARTED', number: '08', name: 'The Uncharted', oneLiner: 'Early-stage presence. Everything is upside.', signalColor: '#7A7A7A',
        parallel: 'A blank map with the best territory still open.',
        threat: 'Without clear digital signals, AI tools have little reason to include you.'
      }
    };

    const formView = document.getElementById('formView');
    const reportView = document.getElementById('reportView');
    const form = document.getElementById('signalForm');
    const reportCard = document.getElementById('reportCard');
    const toast = document.getElementById('toast');
    const monthYear = new Intl.DateTimeFormat('en-US', { month: 'short', year: 'numeric' }).format(new Date()).toUpperCase();
    let currentInputs = null;

    function escapeHtml(value) {
      return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function titleCase(value) {
      return String(value || '').trim().replace(/\w\S*/g, (word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase());
    }

    function categoryKey(category) {
      return String(category || 'Other').toLowerCase().replace(/\s+/g, '-');
    }

    function audienceFor(category) {
      const key = categoryKey(category);
      if (['salon', 'wellness'].includes(key)) return 'clients';
      if (key === 'other') return 'customers';
      return 'patients';
    }

    function calculateScores(inputs) {
      const reviewCount = Math.max(0, Number(inputs.reviewCount) || 0);
      const starRating = clamp(Number(inputs.starRating) || 0, 1, 5);
      const hasWebsite = Boolean(inputs.hasWebsite);
      const hasIg = Boolean(inputs.hasIg);
      const gbpComplete = Boolean(inputs.gbpComplete);
      const reviewScore = Math.min(reviewCount / 150 * 40, 40);
      const starScore = starRating >= 4.5 ? 25 : starRating >= 4.0 ? 18 : starRating >= 3.5 ? 10 : 4;
      const websiteScore = hasWebsite ? 20 : 0;
      const igScore = hasIg ? 10 : 0;
      const gbpScore = gbpComplete ? 5 : 0;
      const trust = Math.round(reviewScore + starScore + websiteScore + igScore + gbpScore);
      const aiBase = gbpComplete ? 30 : 10;
      const aiReviews = Math.min(reviewCount / 100 * 25, 25);
      const aiWeb = hasWebsite ? 20 : 0;
      const aiIg = hasIg ? 15 : 0;
      const aiStar = starRating >= 4.5 ? 10 : starRating >= 4.0 ? 7 : 3;
      const aiVisibility = Math.round(aiBase + aiReviews + aiWeb + aiIg + aiStar);
      const overall = Math.round((trust * 0.5) + (aiVisibility * 0.5));
      return { overall, aiVisibility, trust, hasWebsite, hasIg, gbpComplete };
    }

    function getArchetype(scores) {
      const { overall, aiVisibility, trust, hasWebsite, hasIg, gbpComplete } = scores;
      if (overall >= 75) return archetypes.AUTHORITY;
      if (trust >= 70 && aiVisibility < 50) return archetypes.HIDDEN_GEM;
      if (aiVisibility >= 65 && trust < 55) return archetypes.GHOST_SIGNAL;
      if (!hasWebsite) return archetypes.INVISIBLE;
      if (overall >= 55 && !hasIg) return archetypes.QUIET_GIANT;
      if (trust < 40 && aiVisibility < 40) return archetypes.BLIND_SPOT;
      if (overall >= 60 && gbpComplete) return archetypes.RISING_SIGNAL;
      return archetypes.UNCHARTED;
    }

    function scoreColor(value) {
      if (value >= 70) return 'var(--green-signal)';
      if (value >= 50) return 'var(--gold)';
      return 'var(--red-signal)';
    }

    function getInputsFromForm() {
      return {
        businessName: document.getElementById('businessName').value.trim(),
        category: document.getElementById('category').value,
        city: document.getElementById('city').value.trim(),
        reviewCount: Number(document.getElementById('reviewCount').value) || 0,
        starRating: clamp(Number(document.getElementById('starRating').value) || 1, 1, 5),
        hasWebsite: document.getElementById('hasWebsite').checked,
        hasIg: document.getElementById('hasIg').checked,
        gbpComplete: document.getElementById('gbpComplete').checked
      };
    }

    function setFormInputs(inputs) {
      document.getElementById('businessName').value = inputs.businessName || '';
      document.getElementById('category').value = inputs.category || 'Dental';
      document.getElementById('city').value = inputs.city || '';
      document.getElementById('reviewCount').value = Number.isFinite(Number(inputs.reviewCount)) ? Number(inputs.reviewCount) : '';
      document.getElementById('starRating').value = Number.isFinite(Number(inputs.starRating)) ? Number(inputs.starRating) : '';
      document.getElementById('hasWebsite').checked = Boolean(inputs.hasWebsite);
      document.getElementById('hasIg').checked = Boolean(inputs.hasIg);
      document.getElementById('gbpComplete').checked = Boolean(inputs.gbpComplete);
    }

    function workingBullets(inputs) {
      const audience = audienceFor(inputs.category);
      const bullets = [];
      if (inputs.starRating >= 4.5) bullets.push(`${inputs.starRating.toFixed(1)}-star average — ${audience} trust you before they walk in.`);
      if (inputs.reviewCount >= 80) bullets.push(`${inputs.reviewCount} reviews creates real search weight in ${inputs.city}.`);
      if (inputs.gbpComplete) bullets.push('Complete Google Business Profile — you show up when it matters.');
      if (inputs.hasWebsite && inputs.hasIg) bullets.push(`Website + Instagram gives ${audience} a stronger proof stack before booking.`);
      if (inputs.hasWebsite && bullets.length < 2) bullets.push(`A website gives first-time ${audience} a place to verify services, proof, and next steps.`);
      if (inputs.reviewCount >= 20 && bullets.length < 2) bullets.push(`${inputs.reviewCount} reviews is a usable trust base for local ${inputs.category} searches.`);
      if (!bullets.length) bullets.push(`There is still open territory in ${inputs.city}; the fastest wins are basic trust and visibility signals.`);
      return bullets.slice(0, 3);
    }

    function leakBullets(inputs) {
      const audience = audienceFor(inputs.category);
      const bullets = [];
      if (!inputs.gbpComplete) bullets.push(`Incomplete Google Business Profile means AI search has less confidence when ${audience} search “${inputs.category} in ${inputs.city}.”`);
      if (inputs.reviewCount < 40) bullets.push(`Under 40 reviews makes it harder to appear in AI Overviews for competitive ${inputs.category} queries.`);
      if (!inputs.hasWebsite) bullets.push(`No website means no trust anchor for AI tools or first-time ${audience}.`);
      if (!inputs.hasIg) bullets.push(`Missing Instagram removes a social proof layer many ${inputs.category} ${audience} check before booking.`);
      if (!bullets.length) bullets.push(`The biggest risk is maintenance: competitors can still outrank you by publishing clearer proof, FAQs, and local service pages.`);
      return bullets.slice(0, 2);
    }

    function aiReadinessSentence(score, inputs) {
      if (score >= 70) return `Strong position — when someone asks AI tools for “${inputs.category} in ${inputs.city},” this business is in the conversation.`;
      if (score >= 50) return 'Partial visibility — AI search may surface this business sometimes, but competitors with stronger signals can win the top slot.';
      if (score >= 30) return `Low signal — AI Overviews and ChatGPT are likely recommending better-explained competitors in ${inputs.city} instead.`;
      return 'Near-invisible to AI search — the shift away from traditional Google results can cost new patients before they ever reach the website.';
    }

    function planItems(inputs) {
      const key = categoryKey(inputs.category);
      if (key === 'dental') {
        return [
          { day: 'DAY 1', title: 'Make the first screen answer "Why you?"', context: 'Put your top service, city, strongest review proof, and call/booking step above the fold.' },
          { day: 'DAY 2', title: 'Put trust next to the booking button', context: 'Move reviews, insurance or financing cues, credentials, and patient outcomes closer to the action.' },
          { day: 'DAY 3', title: 'Add the questions AI looks for', context: 'Answer what patients ask before booking so Google, ChatGPT, and Gemini can recommend you with more confidence.' }
        ];
      }
      if (['med-spa', 'aesthetics'].includes(key)) {
        return [
          { day: 'DAY 1', title: 'Name the treatment people are searching for', context: 'Put your top treatment, city, strongest proof, and booking step in the first screen.' },
          { day: 'DAY 2', title: 'Show proof before the booking step', context: 'Move reviews, before/after examples, provider credentials, pricing cues, and safety signals near the CTA.' },
          { day: 'DAY 3', title: 'Add AI-readable treatment answers', context: 'Answer cost, results, downtime, safety, and who the treatment is best for.' }
        ];
      }
      if (['salon', 'wellness'].includes(key)) {
        return [
          { day: 'DAY 1', title: 'Make the service choice obvious', context: 'Put the top service, city, strongest proof, and booking step where clients see it first.' },
          { day: 'DAY 2', title: 'Show proof near the booking step', context: 'Move reviews, photos, credentials, packages, and client outcomes closer to the CTA.' },
          { day: 'DAY 3', title: 'Answer what clients compare', context: 'Add clear answers about price cues, timing, process, results, and who the service is best for.' }
        ];
      }
      return [
        { day: 'DAY 1', title: 'Make the offer obvious in 5 seconds', context: 'Put the main service, city, strongest proof, and next step where customers see it immediately.' },
        { day: 'DAY 2', title: 'Move proof closer to the decision', context: 'Show reviews, examples, credentials, guarantees, and outcomes near the button or form.' },
        { day: 'DAY 3', title: 'Answer the questions buyers compare', context: 'Add plain-language FAQs about price cues, process, timing, service area, and why to choose you.' }
      ];
    }

    function renderRing(label, value) {
      const circumference = 132;
      const dash = circumference - (clamp(value, 0, 100) / 100 * circumference);
      return `
        <section class="score-module" style="--score-color:${scoreColor(value)}; --dash:${dash}">
          <div>
            <p class="score-label">${label}</p>
            <p class="score-value">${value}</p>
          </div>
          <svg class="score-ring" viewBox="0 0 52 52" aria-hidden="true">
            <circle class="track" cx="26" cy="26" r="21" fill="none" stroke-width="3" />
            <circle class="progress" cx="26" cy="26" r="21" fill="none" stroke-width="3" stroke-linecap="round" />
          </svg>
        </section>
      `;
    }

    function hexToRgb(hex) {
      const normalized = String(hex).replace('#', '');
      const value = parseInt(normalized, 16);
      const red = (value >> 16) & 255;
      const green = (value >> 8) & 255;
      const blue = value & 255;
      return red + ', ' + green + ', ' + blue;
    }


    function renderExportScore(label, value) {
      const circumference = 132;
      const dash = circumference - (clamp(value, 0, 100) / 100 * circumference);
      return `
        <section class="export-score">
          <div>
            <div class="export-label">${escapeHtml(label)}</div>
            <div class="export-score-value">${value}</div>
          </div>
          <svg class="export-score-ring" viewBox="0 0 52 52" aria-hidden="true">
            <circle class="export-ring-track" cx="26" cy="26" r="21" fill="none" stroke="#2A2418" stroke-width="4" />
            <circle class="export-ring-progress" cx="26" cy="26" r="21" fill="none" stroke="#C9A84C" stroke-width="4" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="${dash}" transform="rotate(-90 26 26)" />
          </svg>
        </section>
      `;
    }

    function createExportCard(inputs) {
      const scores = calculateScores(inputs);
      const archetype = getArchetype(scores);
      const badge = `${inputs.category.toUpperCase()} · ${inputs.city.toUpperCase()}`;
      const working = workingBullets(inputs).map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      const leaks = leakBullets(inputs).map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      const plan = planItems(inputs).map((item) => `
        <section class="export-plan-card">
          <div class="export-day">${escapeHtml(item.day)}</div>
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.context)}</p>
        </section>
      `).join('');
      const stage = document.createElement('div');
      stage.className = 'signal-export-stage';
      stage.innerHTML = `
        <article class="signal-export-card" aria-label="Export report card">
          <header class="export-header">
            <div class="export-brand">Snapshot Studio</div>
            <div class="export-pill">${escapeHtml(badge)}</div>
            <div class="export-date">${escapeHtml(monthYear)}</div>
          </header>

          <section class="export-hero">
            <p class="export-business">${escapeHtml(inputs.businessName)}</p>
            <div class="export-hero-row">
              <h2 class="export-title">${escapeHtml(archetype.name)}</h2>
              <div class="export-badge">Archetype ${archetype.number}<br />of 08</div>
            </div>
            <p class="export-one-liner">${escapeHtml(archetype.oneLiner)}</p>
            <p class="export-parallel">${escapeHtml(archetype.parallel)} 2026 threat: ${escapeHtml(archetype.threat)}</p>
          </section>

          <section class="export-score-row" aria-label="Score row">
            ${renderExportScore('Overall', scores.overall)}
            ${renderExportScore('AI Visibility', scores.aiVisibility)}
            ${renderExportScore('Trust Signals', scores.trust)}
          </section>

          <section class="export-diagnosis">
            <div class="export-panel">
              <h3 class="export-label">What’s Working</h3>
              <ul class="export-list">${working}</ul>
            </div>
            <div class="export-panel">
              <h3 class="export-label">Biggest Leak</h3>
              <ul class="export-list">${leaks}</ul>
            </div>
          </section>

          <section class="export-readiness">
            <div class="export-meter-head">
              <div>
                <h3 class="export-label">AI Search Readiness</h3>
                <p class="export-meter-sub">How likely ChatGPT, Gemini & AI Overviews surface this business</p>
              </div>
              <div class="export-meter-percent">${scores.aiVisibility}%</div>
            </div>
            <div class="export-meter-track"><div class="export-meter-fill" style="width:${scores.aiVisibility}%"></div></div>
            <p class="export-meter-sentence">${escapeHtml(aiReadinessSentence(scores.aiVisibility, inputs))}</p>
          </section>

          <section class="export-plan" aria-label="3-Day Plan">${plan}</section>

          <footer class="export-footer">
            <div class="export-brand">Generated by Snapshot Studio</div>
            <div class="export-cta">Reply to see the 3 screenshot-backed fixes →</div>
          </footer>
        </article>
      `;
      document.body.appendChild(stage);
      return { stage, card: stage.querySelector('.signal-export-card') };
    }

    function renderReport(inputs) {
      const scores = calculateScores(inputs);
      const archetype = getArchetype(scores);
      const working = workingBullets(inputs).map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      const leaks = leakBullets(inputs).map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      const plan = planItems(inputs).map((item) => `
        <section class="plan-card">
          <div class="day-label">${item.day}</div>
          <h3>${escapeHtml(item.title)}</h3>
          <p>${escapeHtml(item.context)}</p>
        </section>
      `).join('');
      const badge = `${inputs.category.toUpperCase()} · ${inputs.city.toUpperCase()}`;

      reportCard.style.setProperty('--signal', archetype.signalColor);
      reportCard.style.setProperty('--signal-rgb', hexToRgb(archetype.signalColor));
      reportCard.classList.remove('is-ready');
      reportCard.innerHTML = `
        <header class="header-band">
          <div class="brand-label">Snapshot Studio</div>
          <div class="pill">${escapeHtml(badge)}</div>
          <div class="date">${escapeHtml(monthYear)}</div>
        </header>

        <section class="hero-block">
          <p class="business-name">${escapeHtml(inputs.businessName)}</p>
          <div class="archetype-row">
            <h2 class="archetype-title">${escapeHtml(archetype.name)}</h2>
            <div class="archetype-badge">Archetype ${archetype.number}<br />of 08</div>
          </div>
          <p class="one-liner">${escapeHtml(archetype.oneLiner)}</p>
          <p class="parallel">${escapeHtml(archetype.parallel)} 2026 threat: ${escapeHtml(archetype.threat)}</p>
        </section>

        <section class="score-row" aria-label="Score row">
          ${renderRing('Overall', scores.overall)}
          ${renderRing('AI Visibility', scores.aiVisibility)}
          ${renderRing('Trust Signals', scores.trust)}
        </section>

        <section class="diagnosis-block">
          <div class="diagnosis-panel">
            <h3 class="section-title">What’s Working</h3>
            <ul class="signal-list">${working}</ul>
          </div>
          <div class="diagnosis-panel">
            <h3 class="section-title">Biggest Leak</h3>
            <ul class="signal-list leak-list">${leaks}</ul>
          </div>
        </section>

        <section class="readiness">
          <div class="meter-head">
            <div>
              <h3 class="section-title">AI Search Readiness</h3>
              <p class="meter-sub">How likely ChatGPT, Gemini & AI Overviews surface this business</p>
            </div>
            <div class="meter-percent">${scores.aiVisibility}%</div>
          </div>
          <div class="meter-track"><div class="meter-fill" style="--meter:${scores.aiVisibility}%"></div></div>
          <p class="meter-sentence">${escapeHtml(aiReadinessSentence(scores.aiVisibility, inputs))}</p>
        </section>

        <section class="plan" aria-label="3-Day Plan">${plan}</section>

        <footer class="footer-band">
          <div class="footer-signal">Generated by Snapshot Studio</div>
          <div class="footer-cta">Reply to see the 3 screenshot-backed fixes →</div>
        </footer>
      `;

      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => reportCard.classList.add('is-ready'));
      });
    }

    function transitionToReport(inputs, updateUrl = false) {
      currentInputs = inputs;
      renderReport(inputs);
      formView.classList.add('is-hiding');
      setTimeout(() => {
        formView.classList.add('screen-hidden');
        reportView.classList.remove('screen-hidden');
        reportView.classList.add('is-hiding');
        window.requestAnimationFrame(() => reportView.classList.remove('is-hiding'));
      }, 180);
      if (updateUrl) history.replaceState(null, '', buildShareUrl(inputs));
    }

    function transitionToForm() {
      reportView.classList.add('is-hiding');
      setTimeout(() => {
        reportView.classList.add('screen-hidden');
        formView.classList.remove('screen-hidden');
        formView.classList.add('is-hiding');
        window.requestAnimationFrame(() => formView.classList.remove('is-hiding'));
      }, 180);
    }

    function slugify(value) {
      return String(value || 'snapshot-studio').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'snapshot-studio';
    }

    function buildShareUrl(inputs) {
      const params = new URLSearchParams({
        biz: inputs.businessName,
        cat: categoryKey(inputs.category),
        city: inputs.city,
        reviews: String(inputs.reviewCount),
        stars: String(inputs.starRating),
        web: inputs.hasWebsite ? '1' : '0',
        ig: inputs.hasIg ? '1' : '0',
        gbp: inputs.gbpComplete ? '1' : '0'
      });
      return `${window.location.origin}/signal/?${params.toString()}`;
    }

    function inputsFromParams() {
      const params = new URLSearchParams(window.location.search);
      if (![...params.keys()].length) return null;
      const categoryMap = {
        dental: 'Dental', 'med-spa': 'Med Spa', aesthetics: 'Aesthetics', wellness: 'Wellness', salon: 'Salon', chiro: 'Chiro', vision: 'Vision', other: 'Other'
      };
      const inputs = {
        businessName: params.get('biz') || '',
        category: categoryMap[params.get('cat')] || titleCase(params.get('cat') || 'Dental'),
        city: params.get('city') || '',
        reviewCount: Math.max(0, Number(params.get('reviews')) || 0),
        starRating: clamp(Number(params.get('stars')) || 1, 1, 5),
        hasWebsite: params.get('web') === '1',
        hasIg: params.get('ig') === '1',
        gbpComplete: params.get('gbp') === '1'
      };
      if (!inputs.businessName || !inputs.city) return null;
      return inputs;
    }

    function showToast(message) {
      toast.textContent = message;
      window.clearTimeout(showToast.timeout);
      showToast.timeout = window.setTimeout(() => { toast.textContent = ''; }, 2600);
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const inputs = getInputsFromForm();
      setFormInputs(inputs);
      transitionToReport(inputs, false);
    });

    document.getElementById('editBtn').addEventListener('click', () => transitionToForm());

    document.getElementById('copyLinkBtn').addEventListener('click', async () => {
      if (!currentInputs) return;
      const link = buildShareUrl(currentInputs);
      try {
        await navigator.clipboard.writeText(link);
        showToast('Link copied');
      } catch (error) {
        showToast(link);
      }
    });


    document.getElementById('downloadBtn').addEventListener('click', async () => {
      if (!currentInputs || !window.html2canvas) return showToast('Image export is still loading. Try again in a moment.');
      let exportStage = null;
      try {
        showToast('Rendering image...');
        const exportCard = createExportCard(currentInputs);
        exportStage = exportCard.stage;
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        await new Promise((resolve) => window.requestAnimationFrame(() => window.requestAnimationFrame(resolve)));
        const canvas = await window.html2canvas(exportCard.card, {
          backgroundColor: '#0A0A08',
          scale: 2,
          useCORS: true,
          logging: false
        });
        const link = document.createElement('a');
        link.download = `${slugify(currentInputs.businessName)}-signal.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Image downloaded');
      } catch (error) {
        console.error(error);
        showToast('Image export failed. Check the console for details.');
      } finally {
        if (exportStage) exportStage.remove();
      }
    });

    const paramsInputs = inputsFromParams();
    if (paramsInputs) {
      setFormInputs(paramsInputs);
      currentInputs = paramsInputs;
      formView.classList.add('screen-hidden');
      reportView.classList.remove('screen-hidden');
      renderReport(paramsInputs);
    }
  </script>
</body>
</html>
